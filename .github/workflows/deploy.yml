name: Deploy to Render

on:
  push:
    branches: [main]

# This workflow triggers a Render deploy when code is pushed to main.
# To set up:
# 1. Go to https://render.com and create a Blueprint service
# 2. Get your Render Deploy Hook URL from the service settings
# 3. Add it as a GitHub secret named RENDER_DEPLOY_HOOK
# 4. Push to main to trigger auto-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
