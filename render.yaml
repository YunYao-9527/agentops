# Preview deployment. SQLite data is ephemeral on Render Free.
services:
  - type: web
    name: agentops
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./agentops.db
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
