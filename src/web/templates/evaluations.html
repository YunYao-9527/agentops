{% extends "base.html" %}
{% block title %}Evaluations - AgentOps{% endblock %}
{% block nav_evaluations %}text-white bg-gray-800{% endblock %}
{% block page_title %}Evaluations{% endblock %}

{% block content %}
<div x-data="evaluations()" x-init="load()" x-cloak>
    <div class="bg-white rounded-xl shadow-sm border p-6">
        <h3 class="font-semibold mb-4">Experiment History</h3>

        <template x-if="experiments.length > 0">
            <div class="space-y-3">
                <template x-for="e in experiments" :key="e.id">
                    <div class="border rounded-lg p-4">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-medium" x-text="e.name"></h4>
                                <p class="text-xs text-gray-400 mt-1" x-text="'ID: ' + e.id"></p>
                            </div>
                            <span class="px-2 py-0.5 rounded-full text-xs font-medium"
                                  :class="{
                                      'bg-green-100 text-green-700': e.status === 'completed',
                                      'bg-yellow-100 text-yellow-700': e.status === 'running',
                                      'bg-gray-100 text-gray-700': e.status === 'pending',
                                      'bg-red-100 text-red-700': e.status === 'failed',
                                  }"
                                  x-text="e.status"></span>
                        </div>

                        <div class="grid grid-cols-4 gap-4 mt-3 text-sm">
                            <div>
                                <div class="text-xs text-gray-500">Items</div>
                                <div x-text="e.completed_items + '/' + e.total_items"></div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">Failed</div>
                                <div x-text="e.failed_items"></div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">Scores</div>
                                <div x-text="e.aggregate_scores ? JSON.stringify(e.aggregate_scores) : '—'"></div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">Created</div>
                                <div class="text-xs" x-text="new Date(e.created_at).toLocaleString()"></div>
                            </div>
                        </div>

                        <!-- Config -->
                        <div x-show="e.config" class="mt-3 text-xs">
                            <span class="text-gray-500">Config:</span>
                            <span class="font-mono text-gray-600" x-text="JSON.stringify(e.config)"></span>
                        </div>
                    </div>
                </template>
            </div>
        </template>
        <template x-if="experiments.length === 0">
            <p class="text-gray-400 text-center py-8">No evaluations run yet.</p>
        </template>
    </div>
</div>

<script>
function evaluations() {
    return {
        experiments: [],
        async load() {
            try {
                const res = await fetch('/api/v1/evaluations');
                this.experiments = await res.json();
            } catch (e) {
                console.error('Failed to load evaluations:', e);
            }
        }
    }
}
</script>
{% endblock %}
