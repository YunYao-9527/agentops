{% extends "base.html" %}
{% block title %}Datasets - AgentOps{% endblock %}
{% block nav_datasets %}text-white bg-gray-800{% endblock %}
{% block page_title %}Datasets{% endblock %}

{% block content %}
<div x-data="datasets()" x-init="load()" x-cloak>
    <div class="bg-white rounded-xl shadow-sm border p-6">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold">All Datasets</h3>
            <button @click="showCreate = true" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">
                + New Dataset
            </button>
        </div>

        <template x-if="datasetList.length > 0">
            <div class="space-y-3">
                <template x-for="d in datasetList" :key="d.id">
                    <div class="border rounded-lg p-4 hover:bg-gray-50">
                        <div class="flex justify-between items-center">
                            <div>
                                <h4 class="font-medium" x-text="d.name"></h4>
                                <p class="text-sm text-gray-500" x-text="d.description || 'No description'"></p>
                            </div>
                            <div class="text-sm text-gray-500">
                                <span x-text="d.item_count + ' items'"></span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>
        <template x-if="datasetList.length === 0">
            <p class="text-gray-400 text-center py-8">No datasets yet.</p>
        </template>
    </div>

    <!-- Create Modal -->
    <div x-show="showCreate" x-transition class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
        <div class="bg-white rounded-xl p-6 w-full max-w-md" @click.outside="showCreate = false">
            <h3 class="font-semibold mb-4">Create Dataset</h3>
            <input type="text" placeholder="Dataset name" x-model="newName"
                   class="w-full px-3 py-2 border rounded-lg mb-3">
            <input type="text" placeholder="Description (optional)" x-model="newDesc"
                   class="w-full px-3 py-2 border rounded-lg mb-4">
            <div class="flex justify-end gap-2">
                <button @click="showCreate = false" class="px-4 py-2 border rounded-lg text-sm">Cancel</button>
                <button @click="create()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm">Create</button>
            </div>
        </div>
    </div>
</div>

<script>
function datasets() {
    return {
        datasetList: [],
        showCreate: false,
        newName: '',
        newDesc: '',
        async load() {
            try {
                const res = await fetch('/api/v1/datasets');
                this.datasetList = await res.json();
            } catch (e) {
                console.error('Failed to load datasets:', e);
            }
        },
        async create() {
            if (!this.newName) return;
            await fetch('/api/v1/datasets', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: this.newName, description: this.newDesc }),
            });
            this.showCreate = false;
            this.newName = '';
            this.newDesc = '';
            this.load();
        }
    }
}
</script>
{% endblock %}
